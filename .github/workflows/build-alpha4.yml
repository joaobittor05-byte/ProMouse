name: Build Leo Optimazer Alpha4

on:
  push:
    branches: [ "leo-optimazer-v1" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-alpha4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk LeoOptimazer-v1-alpha4-perapp-real.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LeoOptimazer-V1-Alpha4-PerApp-Real
          path: LeoOptimazer-v1-alpha4-perapp-real.apk
          if-no-files-found: error
          retention-days: 30
