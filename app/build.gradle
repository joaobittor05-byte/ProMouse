plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leo.optimazer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leo.optimazer'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.0.0-alpha7-virtual-dpi'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/leo/AndroidManifest.xml'
            java.srcDirs = ['src/leo/java']
            aidl.srcDirs = ['src/leo/aidl']
            res.srcDirs = ['src/leo/res']
        }
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.annotation:annotation:1.9.1'
}
