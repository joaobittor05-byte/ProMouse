plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leo.optimazer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leo.optimazer'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.0-alpha3-brevent-fix'
    }

    sourceSets {
        main {
            manifest.srcFile 'src/leo/AndroidManifest.xml'
            java.srcDirs = ['src/leo/java']
            res.srcDirs = ['src/leo/res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
